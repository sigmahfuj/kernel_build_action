name: Build Kernel

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Download Only camellian-t-oss
        uses: actions/checkout@v4
        with:
          repository: noonomyen/camellian-linux
          ref: master
          sparse-checkout: camellian-t-oss
          sparse-checkout-cone-mode: true
          path: source

      - name: Verify Kernel Source
        run: |
          ls -la source/camellian-t-oss
          test -f source/camellian-t-oss/Makefile
          test -d source/camellian-t-oss/arch

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./source/camellian-t-oss/
          config: camellian_gl_base_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
